name: Fuzz

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fuzz.yml
      - scripts/fuzz.py
  schedule:
    - cron: "41 6 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  TREE_SITTER_JS_RUNTIME: native

jobs:
  fuzz:
    name: Fuzz corpus edits
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup toolchain install 1.90.0 --profile minimal

      - name: Install tree-sitter with QuickJS only
        run: cargo install tree-sitter-cli --version 0.27.1 --locked --no-default-features --features qjs-rt

      - name: Fuzz corpus edits with a changing seed
        id: fuzz
        env:
          FUZZ_SEED: ${{ github.run_id }}
        run: python3 scripts/fuzz.py --seed "$FUZZ_SEED" --iterations 5000 --edits 8

      - name: Upload fuzzing logs and replay settings
        if: ${{ !cancelled() && steps.fuzz.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-long-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            work/fuzz/**/combined.log
            work/fuzz/**/version.log
            work/fuzz/**/settings.json
            work/fuzz/**/replay.txt
          if-no-files-found: error
          retention-days: 7
