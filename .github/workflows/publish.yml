name: Publish

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Validate release
    uses: $/.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    name: Publish to crates.io
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: crates.io
    permissions:
      contents: read
      id-token: write # Exchange GitHub OIDC identity for a short-lived crates.io token.
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Verify release tag and package versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import tomllib
          from pathlib import Path

          package = tomllib.loads(Path("Cargo.toml").read_text())["package"]
          version = package["version"]
          expected_tag = f"v{version}"
          if os.environ["RELEASE_TAG"] != expected_tag:
              raise SystemExit(f"The release tag must be {expected_tag!r}.")
          metadata = json.loads(Path("tree-sitter.json").read_text())["metadata"]
          if metadata["version"] != version:
              raise SystemExit("Cargo.toml and tree-sitter.json versions must match.")
          PY

      - name: Install Rust toolchain
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt --component clippy

      - name: Verify publishable package
        run: cargo publish --locked --dry-run --package woodruffw-trough-tree-sitter-powershell

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked --package woodruffw-trough-tree-sitter-powershell
