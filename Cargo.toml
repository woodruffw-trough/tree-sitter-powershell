[package]
name = "woodruffw-trough-tree-sitter-powershell"
version = "0.1.1"
description = "A tree-sitter grammar for PowerShell"
authors = ["tree-sitter-powershell contributors"]
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/woodruffw-trough/tree-sitter-powershell"
readme = "README.md"
keywords = ["incremental", "parsing", "tree-sitter", "powershell"]
categories = ["parsing", "text-editors"]
build = "bindings/rust/build.rs"
include = [
    "bindings/rust/*",
    "docs/*",
    "grammar.js",
    "queries/*",
    "src/**",
    "tree-sitter.json",
    "LICENSE",
    "README.md",
    "CONTRIBUTING.md",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = "0.27.1"
serde_json = "1"
